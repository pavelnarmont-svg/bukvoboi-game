<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0e1a2b">
  <meta name="description" content="Буквобой — словесная игра для 2–4 игроков на одном устройстве">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Буквобой">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // тема до загрузки скрипта игры — чтобы не было вспышки другого цвета
    try {
      var prefs = JSON.parse(localStorage.getItem('bukvoboy:v1:prefs') || '{}') || {};
      var t = prefs.theme;
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.palette = prefs.palette || 'classic';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="app.css?v=cb740b3fee">
  <title>Буквобой</title>
</head>
<body>
  <div id="app"></div>
  <noscript>Для игры нужен включённый JavaScript.</noscript>
  <script type="module" src="app.js?v=cb740b3fee"></script>
</body>
</html>
